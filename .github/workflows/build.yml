name: Build ESP32 firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Find sketch
        run: |
          INO=$(find . -name '*.ino' -not -path './sketch/*' -not -path './build/*' | head -n 1)
          if [ -z "$INO" ]; then echo "No .ino file found"; exit 1; fi
          NAME=$(basename "$INO" .ino)
          mkdir -p "sketch/$NAME"
          cp "$INO" "sketch/$NAME/$NAME.ino"
          echo "NAME=$NAME" >> $GITHUB_ENV

      - name: Install ESP32 core and ESP32Servo library
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls $URL
          arduino-cli core install esp32:esp32 --additional-urls $URL
          arduino-cli lib install ESP32Servo
          arduino-cli lib list | grep -i ESP32Servo

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:FlashMode=dio,FlashFreq=40,FlashSize=4M,PartitionScheme=default \
            --output-dir build "sketch/$NAME"
          ls -l build

      - name: Build full 4MB image
        run: |
          pip install "esptool==4.8.1"
          mkdir out
          cp "build/$NAME.ino.bootloader.bin" out/bootloader.bin
          cp "build/$NAME.ino.partitions.bin" out/partitions.bin
          cp "build/$NAME.ino.bin" out/firmware.bin
          cp "$(find ~/.arduino15 -name boot_app0.bin | head -n 1)" out/boot_app0.bin
          cd out
          esptool.py --chip esp32 merge_bin -o merged_4MB.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            --fill-flash-size 4MB \
            0x1000 bootloader.bin 0x8000 partitions.bin \
            0xe000 boot_app0.bin 0x10000 firmware.bin
                    esptool.py image_info firmware.bin
          cat > README.txt <<'EOF'
          1. Erase flash first (optional but recommended)
          2. Flash ONLY merged_4MB.bin at offset 0x0
          merged_4MB.bin fills the whole 4MB flash, so everything old is overwritten.
          Separate files (only if needed):
            bootloader.bin 0x1000 | partitions.bin 0x8000 | boot_app0.bin 0xE000 | firmware.bin 0x10000
          EOF

      - name: Verify
        run: |
          python3 - <<'EOF'
          d = open("out/merged_4MB.bin", "rb").read()
          assert len(d) == 4194304, len(d)
          assert d[0x1000] == 0xE9, "bootloader magic"
          assert d[0x8000:0x8002] == b"\xaa\x50", "partition table magic"
          assert d[0x10000] == 0xE9, "app magic"
          print("merged image OK, size", len(d))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: esp32_release
          path: out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/*
